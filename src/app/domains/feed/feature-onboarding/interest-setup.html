<main class="interest-page">
  <section class="interest-card card" aria-labelledby="interest-title">
    <p class="eyebrow">Willkommen bei Curio</p>
    <h1 id="interest-title">Was interessiert dich?</h1>
    <p class="description">
      Wähle deine Lieblingsthemen. Wir passen deinen Feed daran an.
    </p>

    <div class="chip-group" role="group" aria-labelledby="interest-title">
      @for (category of categories; track category) {
        <button
          type="button"
          class="chip"
          [attr.aria-pressed]="selectedInterests().includes(category)"
          [disabled]="loading()"
          (click)="toggleInterest(category)"
        >
          @if (selectedInterests().includes(category)) {
            <span aria-hidden="true">✓ </span>
          }
          {{ category }}
        </button>
      }
    </div>

    @if (message()) {
      <p class="status-message is-error" role="alert">{{ message() }}</p>
    }

    <button
      class="btn btn-primary btn-block"
      type="button"
      [disabled]="loading()"
      [attr.aria-busy]="loading()"
      (click)="save()"
    >
      {{ loading() ? 'Wird gespeichert …' : 'Weiter zu Curio' }}
    </button>
  </section>
</main>
