<main class="interest-page">
  <section class="interest-card card" aria-labelledby="interest-title">
    <p class="eyebrow">Willkommen bei Curio</p>
    <h1 id="interest-title">Was interessiert dich?</h1>
    <p class="description">
      Wähle deine Lieblingsthemen. Wir passen deinen Feed daran an.
    </p>

    <app-interest-picker
      class="picker"
      [options]="categories"
      [selected]="selectedInterests()"
      [disabled]="loading()"
      labelledBy="interest-title"
      (toggled)="toggleInterest($event)"
    />

    @if (message()) {
      <p class="status-message is-error" role="alert">{{ message() }}</p>
    }

    <button
      class="btn btn-primary btn-block"
      type="button"
      [disabled]="loading()"
      [attr.aria-busy]="loading()"
      (click)="save()"
    >
      {{ loading() ? 'Wird gespeichert …' : 'Weiter zu Curio' }}
    </button>
  </section>
</main>
